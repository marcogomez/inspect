name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24]

    steps:
      - uses: actions/checkout@v4

      # node-canvas backs the canvas 2d context in the test environment. it ships
      # napi prebuilds for every runner here, so no system libraries are needed;
      # package.json lists it in pnpm.onlyBuiltDependencies so pnpm is allowed to
      # run its install script and fetch that prebuild.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test
